name: CPU integration checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-22.04
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/dd2414-ci-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'setuptools>=64' wheel
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,test]'
      - run: python tools/quality/check_source.py
      - run: python tools/quality/check_links.py
      - run: dd2414 train --help && dd2414 evaluate --help
      - run: python tools/testing/run_cpu_regressions.py
      - run: git diff --check
